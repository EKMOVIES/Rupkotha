<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>অ্যাডমিন লগইন - রূপকথা</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-theme.css" />
    <style>
        .admin-login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 30% 20%, rgba(139, 92, 246, 0.1), transparent 70%);
            padding: 20px;
        }
        .admin-login-box {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: var(--radius);
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .admin-login-box .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .admin-login-box .logo i {
            font-size: 3rem;
            color: var(--primary);
            background: rgba(139, 92, 246, 0.15);
            padding: 16px;
            border-radius: 50%;
        }
        .admin-login-box .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-top: 12px;
        }
        .admin-login-box .logo p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .admin-login-box .lock-icon {
            color: var(--primary);
            margin-right: 8px;
        }
        .admin-login-box .form-group {
            margin-bottom: 20px;
        }
        .admin-login-box .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
        }
        .admin-login-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--dark);
            border: 1px solid var(--dark-border);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            transition: var(--transition);
        }
        .admin-login-box .form-group input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }
        .admin-login-box .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .admin-login-box .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }
        .admin-login-box .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .admin-login-box .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #EF4444;
            color: #EF4444;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .admin-login-box .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 14px;
            text-decoration: none;
            transition: var(--transition);
        }
        .admin-login-box .back-link:hover {
            color: white;
        }
        .admin-login-box .back-link i {
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="admin-login-wrapper">
        <div class="admin-login-box">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
                <h1>🔐 অ্যাডমিন লগইন</h1>
                <p>শুধুমাত্র অ্যাডমিন ইউজারদের জন্য</p>
            </div>

            <div id="errorMsg" class="error-msg">
                <i class="fas fa-exclamation-circle"></i> <span id="errorText">ইমেইল বা পাসওয়ার্ড ভুল!</span>
            </div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope lock-icon"></i> ইমেইল</label>
                    <input type="email" id="email" placeholder="admin@rupkotha.com" required autofocus />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock lock-icon"></i> পাসওয়ার্ড</label>
                    <input type="password" id="password" placeholder="পাসওয়ার্ড দিন" required />
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> লগইন করুন
                </button>
            </form>

            <a href="login.html" class="back-link">
                <i class="fas fa-arrow-left"></i> সাধারণ ইউজার লগইন
            </a>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabase } from './js/config.js';
        import { showToast } from './js/main.js';

        const form = document.getElementById('adminLoginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> লগইন হচ্ছে...';
            errorMsg.style.display = 'none';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('দয়া করে ইমেইল ও পাসওয়ার্ড দিন!');
                resetButton();
                return;
            }

            try {
                // ১. লগইন চেষ্টা করুন
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    console.error('Login error:', error);
                    if (error.message.includes('Invalid login credentials')) {
                        showError('❌ ইমেইল বা পাসওয়ার্ড ভুল!');
                    } else {
                        showError('❌ ' + error.message);
                    }
                    resetButton();
                    return;
                }

                // ২. ইউজার অ্যাডমিন কিনা চেক করুন
                const user = data.user;
                const role = user?.user_metadata?.role;

                if (role !== 'admin') {
                    // অ্যাডমিন না হলে লগআউট করে দিন
                    await supabase.auth.signOut();
                    showError('⛔ আপনার অ্যাকাউন্ট অ্যাডমিন নয়!');
                    resetButton();
                    return;
                }

                // ৩. অ্যাডমিন হলে ড্যাশবোর্ডে নিয়ে যান
                showToast('🎉 স্বাগতম অ্যাডমিন!', 'success');
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 1000);

            } catch (error) {
                console.error('Unexpected error:', error);
                showError('❌ কিছু ভুল হয়েছে! আবার চেষ্টা করুন।');
                resetButton();
            }
        });

        function showError(message) {
            errorText.textContent = message;
            errorMsg.style.display = 'block';
        }

        function resetButton() {
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> লগইন করুন';
        }
    </script>
</body>
</html>
