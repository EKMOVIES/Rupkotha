<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>অর্ডার ম্যানেজ - রূপকথা</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-theme.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <style>
        .status-badge { padding: 4px 12px; border-radius: 50px; font-size: 12px; font-weight: 600; }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: #F59E0B; }
        .status-processing { background: rgba(59, 130, 246, 0.2); color: #3B82F6; }
        .status-shipped { background: rgba(139, 92, 246, 0.2); color: #8B5CF6; }
        .status-delivered { background: rgba(16, 185, 129, 0.2); color: #10B981; }
        .status-cancelled { background: rgba(239, 68, 68, 0.2); color: #EF4444; }
        .order-card { background: var(--dark-card); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; border: 1px solid var(--dark-border); }
    </style>
</head>
<body>
    <!-- ===== NAVIGATION ===== -->
    <nav class="navbar" id="mainNav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <i class="fas fa-spa"></i>
                <span>রূপকথা</span>
                <small>Beauty</small>
            </a>
            <button class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">হোম</a></li>
                <li><a href="products.html">প্রোডাক্ট</a></li>
                <li><a href="cart.html">কার্ট <span class="cart-badge" id="cartBadge">0</span></a></li>
                <li class="auth-links" id="authLinks">
                    <a href="login.html" class="btn-outline-light">লগইন</a>
                    <a href="register.html" class="btn-primary">রেজিস্টার</a>
                </li>
                <li class="user-menu" id="userMenu" style="display:none;">
                    <div class="user-dropdown">
                        <button class="user-btn" id="userBtn">
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=User&background=8B5CF6&color=fff&size=32" alt="Avatar" />
                            <span id="userName">User</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="admin-dashboard.html">📊 ড্যাশবোর্ড</a>
                            <a href="admin-add-product.html">📦 প্রোডাক্ট যোগ</a>
                            <a href="admin-manage-products.html">📋 প্রোডাক্ট লিস্ট</a>
                            <a href="admin-categories.html">📂 ক্যাটাগরি</a>
                            <a href="admin-orders.html">📋 অর্ডার</a>
                            <hr />
                            <a href="#" id="logoutBtn">লগআউট</a>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- ===== ORDERS SECTION ===== -->
    <section style="padding-top: 120px; padding-bottom: 60px;">
        <div class="container">
            <div class="section-header">
                <span class="section-tag">অ্যাডমিন</span>
                <h2>📦 সকল অর্ডার</h2>
                <p>সকল অর্ডার দেখুন ও স্ট্যাটাস আপডেট করুন</p>
            </div>

            <div id="loadingSpinner" style="text-align: center; padding: 40px 0;">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
                <p style="color: var(--text-secondary); margin-top: 12px;">অর্ডার লোড হচ্ছে...</p>
            </div>

            <div id="ordersList"></div>

            <div id="noOrders" style="display: none; text-align: center; padding: 60px 0;">
                <i class="fas fa-box-open" style="font-size: 3rem; color: var(--text-secondary);"></i>
                <h3 style="color: var(--text-secondary);">কোনো অর্ডার নেই</h3>
            </div>
        </div>
    </section>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabase } from './js/config.js';
        import { checkAuth, updateAuthUI, setupDropdown, setupLogout } from './js/auth.js';
        import { updateCartBadge } from './js/products.js';
        import { isAdmin } from './js/admin.js';
        import { getAllOrders, updateOrderStatus } from './js/orders.js';

        const user = await checkAuth();
        updateAuthUI(user);
        updateCartBadge();
        setupDropdown();
        setupLogout();

        const admin = await isAdmin();
        if (!admin) {
            document.querySelector('.section-header h2').innerHTML = '⛔ অ্যাক্সেস অস্বীকৃত';
            document.querySelector('.section-header').innerHTML += '<p style="color: #EF4444;">শুধুমাত্র অ্যাডমিন ইউজার এই পেজ দেখতে পারেন।</p>';
            document.getElementById('loadingSpinner').style.display = 'none';
        } else {
            loadOrders();
        }

        async function loadOrders() {
            const spinner = document.getElementById('loadingSpinner');
            const container = document.getElementById('ordersList');
            const noOrders = document.getElementById('noOrders');

            try {
                const orders = await getAllOrders();
                spinner.style.display = 'none';

                if (!orders || orders.length === 0) {
                    noOrders.style.display = 'block';
                    return;
                }

                container.innerHTML = orders.map(order => `
                    <div class="order-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px;">
                            <div>
                                <p style="font-weight: 600; color: var(--primary);">#${order.order_number}</p>
                                <p style="color: var(--text-secondary); font-size: 14px;">${new Date(order.created_at).toLocaleDateString('bn-BD')}</p>
                            </div>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <select onchange="updateStatus('${order.id}', this.value)" style="padding: 6px 12px; background: var(--dark); border: 1px solid var(--dark-border); border-radius: 6px; color: white;">
                                    <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>⏳ পেন্ডিং</option>
                                    <option value="processing" ${order.status === 'processing' ? 'selected' : ''}>🔄 প্রসেসিং</option>
                                    <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>🚚 শিপ্পিং</option>
                                    <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>✅ ডেলিভারি</option>
                                    <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>❌ ক্যান্সেল</option>
                                </select>
                                <span class="status-badge status-${order.status}">${getStatusText(order.status)}</span>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; color: var(--text-secondary); font-size: 14px;">
                            <p><i class="fas fa-user"></i> ${order.shipping_name}</p>
                            <p><i class="fas fa-phone"></i> ${order.shipping_phone}</p>
                            <p><i class="fas fa-map-marker-alt"></i> ${order.shipping_address}</p>
                            <p><i class="fas fa-city"></i> ${order.shipping_city}</p>
                            <p><i class="fas fa-credit-card"></i> ${order.payment_method}</p>
                            <p style="font-weight: 700; color: var(--primary);">মোট: ৳${order.total.toFixed(2)}</p>
                        </div>
                        <details style="margin-top: 12px; cursor: pointer;">
                            <summary style="color: var(--text-secondary); font-weight: 500;">
                                <i class="fas fa-chevron-down"></i> প্রোডাক্ট দেখুন
                            </summary>
                            <div id="items-${order.id}" style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--dark-border);"></div>
                        </details>
                    </div>
                `).join('');

                // Load items for each order
                for (const order of orders) {
                    const { data: items } = await supabase.from('order_items').select('*').eq('order_id', order.id);
                    const itemsContainer = document.getElementById(`items-${order.id}`);
                    if (itemsContainer && items) {
                        itemsContainer.innerHTML = items.map(item => `
                            <div style="display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--dark-border);">
                                <span style="flex: 1;">${item.product_name}</span>
                                <span>${item.quantity} × ৳${item.product_price.toFixed(2)}</span>
                                <span style="font-weight: 600;">৳${(item.quantity * item.product_price).toFixed(2)}</span>
                            </div>
                        `).join('');
                    }
                }

                window.updateStatus = async (orderId, status) => {
                    try {
                        await updateOrderStatus(orderId, status);
                        showToast('✅ স্ট্যাটাস আপডেট করা হয়েছে!', 'success');
                        loadOrders();
                    } catch (error) {
                        showToast('❌ ' + error.message, 'error');
                    }
                };

            } catch (error) {
                console.error('Error loading orders:', error);
                spinner.style.display = 'none';
                container.innerHTML = `<div style="text-align: center; padding: 40px; color: #EF4444;"><i class="fas fa-exclamation-triangle" style="font-size: 2rem;"></i><p>অর্ডার লোড করতে ব্যর্থ!</p></div>`;
            }
        }

        function getStatusText(status) {
            const texts = { 'pending': '⏳ পেন্ডিং', 'processing': '🔄 প্রসেসিং', 'shipped': '🚚 শিপ্পিং', 'delivered': '✅ ডেলিভারি', 'cancelled': '❌ ক্যান্সেল' };
            return texts[status] || status;
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
