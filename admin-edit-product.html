<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>প্রোডাক্ট এডিট - রূপকথা</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-theme.css" />
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="mainNav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <i class="fas fa-spa"></i>
                <span>রূপকথা</span>
                <small>Beauty</small>
            </a>
            <button class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">হোম</a></li>
                <li><a href="products.html">প্রোডাক্ট</a></li>
                <li><a href="cart.html">কার্ট <span class="cart-badge" id="cartBadge">0</span></a></li>
                <li class="auth-links" id="authLinks">
                    <a href="login.html" class="btn-outline-light">লগইন</a>
                    <a href="register.html" class="btn-primary">রেজিস্টার</a>
                </li>
                <li class="user-menu" id="userMenu" style="display:none;">
                    <div class="user-dropdown">
                        <button class="user-btn" id="userBtn">
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=User&background=8B5CF6&color=fff&size=32" alt="Avatar" />
                            <span id="userName">User</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="admin-add-product.html">📦 প্রোডাক্ট যোগ</a>
                            <a href="admin-manage-products.html">📋 প্রোডাক্ট লিস্ট</a>
                            <hr />
                            <a href="#" id="logoutBtn">লগআউট</a>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Edit Form -->
    <section style="padding-top: 120px; padding-bottom: 60px;">
        <div class="container" style="max-width: 700px; margin: 0 auto;">
            <div class="section-header">
                <span class="section-tag">অ্যাডমিন</span>
                <h2>✏️ প্রোডাক্ট এডিট করুন</h2>
            </div>

            <form id="editForm" style="background: var(--dark-card); padding: 40px; border-radius: var(--radius); border: 1px solid var(--dark-border);">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">প্রোডাক্টের নাম *</label>
                    <input type="text" id="productName" required 
                           style="width: 100%; padding: 12px; background: var(--dark); border: 1px solid var(--dark-border); border-radius: 8px; color: white; font-size: 16px;" />
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">বিবরণ *</label>
                    <textarea id="productDesc" required rows="4"
                              style="width: 100%; padding: 12px; background: var(--dark); border: 1px solid var(--dark-border); border-radius: 8px; color: white; font-size: 16px;"></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">দাম (৳) *</label>
                        <input type="number" id="productPrice" required step="0.01"
                               style="width: 100%; padding: 12px; background: var(--dark); border: 1px solid var(--dark-border); border-radius: 8px; color: white; font-size: 16px;" />
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">স্টক</label>
                        <input type="number" id="productStock" required
                               style="width: 100%; padding: 12px; background: var(--dark); border: 1px solid var(--dark-border); border-radius: 8px; color: white; font-size: 16px;" />
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">ক্যাটাগরি *</label>
                    <select id="productCategory" required
                            style="width: 100%; padding: 12px; background: var(--dark); border: 1px solid var(--dark-border); border-radius: 8px; color: white; font-size: 16px;">
                        <option value="ফাউন্ডেশন">ফাউন্ডেশন</option>
                        <option value="লিপস্টিক">লিপস্টিক</option>
                        <option value="আই শ্যাডো">আই শ্যাডো</option>
                        <option value="ব্লাশ">ব্লাশ</option>
                        <option value="কনসিলার">কনসিলার</option>
                        <option value="ব্রাশ">ব্রাশ</option>
                    </select>
                </div>

                <!-- ✅ ইমেজ আপলোড সেকশন (আপডেটেড) -->
                <div style="margin-bottom: 20px; border: 2px dashed var(--dark-border); padding: 20px; border-radius: 8px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">📸 প্রোডাক্ট ইমেজ</label>
                    
                    <!-- ইমেজ প্রিভিউ -->
                    <div id="imagePreviewContainer" style="margin-bottom: 15px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                        <!-- ডাইনামিক প্রিভিউ এখানে দেখাবে -->
                    </div>

                    <!-- ইমেজ আপলোড বাটন -->
                    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <label for="imageUpload" class="btn-primary" style="cursor: pointer; padding: 10px 20px; display: inline-block;">
                            <i class="fas fa-upload"></i> নতুন ইমেজ আপলোড
                        </label>
                        <input type="file" id="imageUpload" accept="image/*" style="display: none;" />
                        
                        <button type="button" id="removeImageBtn" class="btn-outline-light" style="border-color: #EF4444; color: #EF4444; padding: 10px 20px;">
                            <i class="fas fa-trash"></i> ইমেজ রিমুভ
                        </button>
                    </div>
                    
                    <small style="color: var(--text-secondary); display: block; margin-top: 8px;">
                        নতুন ইমেজ আপলোড করলে পুরনো ইমেজ রিপ্লেস হবে। JPG, PNG, WebP সাপোর্টেড (ম্যাক্স 10MB)।
                    </small>
                    
                    <!-- হিডেন ফিল্ড (পুরনো ইমেজ URL সংরক্ষণের জন্য) -->
                    <input type="hidden" id="oldImageUrl" value="" />
                    <input type="hidden" id="newImageUrl" value="" />
                </div>

                <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 12px;">
                    <input type="checkbox" id="productFeatured" style="width: 20px; height: 20px;" />
                    <label for="productFeatured" style="font-weight: 500;">ফিচার্ড প্রোডাক্ট হিসেবে দেখান</label>
                </div>

                <div id="messageBox" style="margin-bottom: 20px; display: none; padding: 12px; border-radius: 8px; text-align: center;">
                </div>

                <div style="display: flex; gap: 12px;">
                    <button type="submit" class="btn-primary" style="flex: 1; padding: 14px; font-size: 18px;" id="submitBtn">
                        <i class="fas fa-save"></i> আপডেট করুন
                    </button>
                    <a href="admin-manage-products.html" class="btn-outline-light" style="flex: 0.5; padding: 14px; text-align: center; text-decoration: none;">
                        <i class="fas fa-times"></i> বাতিল
                    </a>
                </div>
            </form>
        </div>
    </section>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabase, supabaseAdmin } from './js/config.js';
        import { checkAuth, updateAuthUI } from './js/auth.js';
        import { updateCartBadge } from './js/products.js';
        import { isAdmin } from './js/admin.js';
        import { uploadImageToCloudinary } from './js/upload.js';

        // Initialize Auth
        const user = await checkAuth();
        updateAuthUI(user);
        updateCartBadge();

        // Admin Check
        const admin = await isAdmin();
        if (!admin) {
            document.querySelector('.section-header h2').innerHTML = '⛔ অ্যাক্সেস অস্বীকৃত';
            document.querySelector('.section-header').innerHTML += '<p style="color: #EF4444;">শুধুমাত্র অ্যাডমিন ইউজার এই পেজ দেখতে পারেন।</p>';
            document.getElementById('editForm').style.display = 'none';
        }

        // Get Product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if (!productId) {
            showMessage('❌ প্রোডাক্ট আইডি পাওয়া যায়নি!', 'error');
        }

        let currentImageUrl = '';
        let newImageFile = null;

        // Load Product Data
        async function loadProduct() {
            const { data, error } = await supabase
                .from('products')
                .select('*')
                .eq('id', productId)
                .single();

            if (error) {
                console.error('Error loading product:', error);
                showMessage('❌ প্রোডাক্ট লোড করতে ব্যর্থ!', 'error');
                return;
            }

            // Fill form
            document.getElementById('productName').value = data.name;
            document.getElementById('productDesc').value = data.description;
            document.getElementById('productPrice').value = data.price;
            document.getElementById('productStock').value = data.stock;
            document.getElementById('productCategory').value = data.category;
            document.getElementById('productFeatured').checked = data.featured;
            
            // Store old image URL
            currentImageUrl = data.image_url;
            document.getElementById('oldImageUrl').value = data.image_url;
            
            // Show image preview
            updateImagePreview(data.image_url);
        }

        // Update image preview
        function updateImagePreview(imageUrl) {
            const container = document.getElementById('imagePreviewContainer');
            if (imageUrl && imageUrl.trim() !== '') {
                container.innerHTML = `
                    <div style="position: relative; display: inline-block;">
                        <img src="${imageUrl}" id="previewImg" style="max-width: 200px; max-height: 200px; border-radius: 8px; border: 2px solid var(--primary);" />
                        <span id="imageStatus" style="display: block; font-size: 12px; color: var(--text-secondary); margin-top: 4px;">বর্তমান ইমেজ</span>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div style="padding: 20px; background: var(--dark); border-radius: 8px; color: var(--text-secondary); text-align: center; width: 100%;">
                        <i class="fas fa-image" style="font-size: 2rem; display: block; margin-bottom: 8px;"></i>
                        কোন ইমেজ নেই
                    </div>
                `;
            }
        }

        loadProduct();

        // Image upload handling
        document.getElementById('imageUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                showMessage('⏳ ইমেজ আপলোড হচ্ছে...', 'info');
                
                // Upload to Cloudinary
                const result = await uploadImageToCloudinary(file);
                
                // Store new image URL
                document.getElementById('newImageUrl').value = result.url;
                newImageFile = result.url;
                
                // Update preview
                updateImagePreview(result.url);
                
                // Update status
                const statusSpan = document.getElementById('imageStatus');
                if (statusSpan) {
                    statusSpan.textContent = '✅ নতুন ইমেজ (আপলোড হয়েছে)';
                    statusSpan.style.color = '#10B981';
                }
                
                showMessage('✅ ইমেজ আপলোড সফল! ফর্ম সাবমিট করলে আপডেট হবে।', 'success');
                
            } catch (error) {
                console.error('Upload error:', error);
                showMessage('❌ ইমেজ আপলোড ব্যর্থ: ' + error.message, 'error');
            }
        });

        // Remove image
        document.getElementById('removeImageBtn').addEventListener('click', () => {
            if (confirm('আপনি কি এই ইমেজটি রিমুভ করতে চান? (ডিফল্ট ইমেজ সেট হবে)')) {
                document.getElementById('newImageUrl').value = '';
                newImageFile = '';
                updateImagePreview('');
                showMessage('ℹ️ ইমেজ রিমুভ করা হয়েছে। ফর্ম সাবমিট করলে ডিফল্ট ইমেজ সেট হবে।', 'info');
            }
        });

        // Form Submit
        const form = document.getElementById('editForm');
        const messageBox = document.getElementById('messageBox');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> আপডেট হচ্ছে...';
            
            try {
                const name = document.getElementById('productName').value.trim();
                const description = document.getElementById('productDesc').value.trim();
                const price = parseFloat(document.getElementById('productPrice').value);
                const category = document.getElementById('productCategory').value;
                const stock = parseInt(document.getElementById('productStock').value);
                const featured = document.getElementById('productFeatured').checked;
                
                // Determine image URL: new > old > default
                let imageUrl = document.getElementById('newImageUrl').value;
                if (!imageUrl) {
                    imageUrl = document.getElementById('oldImageUrl').value;
                }
                // If no image at all, use a default placeholder
                if (!imageUrl) {
                    imageUrl = 'https://via.placeholder.com/300x300/1A1A1A/8B5CF6?text=No+Image';
                }

                // Validation
                if (!name || !description || !price || !category) {
                    throw new Error('দয়া করে সব ফিল্ড পূরণ করুন!');
                }

                // Update product
                const { error } = await supabaseAdmin
                    .from('products')
                    .update({
                        name,
                        description,
                        price,
                        category,
                        image_url: imageUrl,
                        stock,
                        featured,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', productId);

                if (error) throw error;

                showMessage('✅ প্রোডাক্ট সফলভাবে আপডেট করা হয়েছে! 🎉', 'success');
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'admin-manage-products.html';
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                showMessage('❌ ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save"></i> আপডেট করুন';
            }
        });

        function showMessage(message, type = 'info') {
            messageBox.style.display = 'block';
            messageBox.innerHTML = message;
            
            if (type === 'error') {
                messageBox.style.background = 'rgba(239, 68, 68, 0.1)';
                messageBox.style.color = '#EF4444';
                messageBox.style.border = '1px solid #EF4444';
            } else if (type === 'success') {
                messageBox.style.background = 'rgba(16, 185, 129, 0.1)';
                messageBox.style.color = '#10B981';
                messageBox.style.border = '1px solid #10B981';
            } else {
                messageBox.style.background = 'rgba(59, 130, 246, 0.1)';
                messageBox.style.color = '#3B82F6';
                messageBox.style.border = '1px solid #3B82F6';
            }
            
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 6000);
        }
    </script>
</body>
</html>
