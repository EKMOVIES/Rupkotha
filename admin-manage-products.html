<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোডাক্ট ম্যানেজ - রূপকথা</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-theme.css" />
</head>
<body>
    <!-- Navigation Include -->
    <nav class="navbar" id="mainNav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <i class="fas fa-spa"></i>
                <span>রূপকথা</span>
                <small>Beauty</small>
            </a>
            <button class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">হোম</a></li>
                <li><a href="products.html">প্রোডাক্ট</a></li>
                <li><a href="cart.html">কার্ট <span class="cart-badge" id="cartBadge">0</span></a></li>
                <li class="auth-links" id="authLinks">
                    <a href="login.html" class="btn-outline-light">লগইন</a>
                    <a href="register.html" class="btn-primary">রেজিস্টার</a>
                </li>
                <li class="user-menu" id="userMenu" style="display:none;">
                    <div class="user-dropdown">
                        <button class="user-btn" id="userBtn">
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=User&background=8B5CF6&color=fff&size=32" alt="Avatar" />
                            <span id="userName">User</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="admin-add-product.html">📦 প্রোডাক্ট যোগ</a>
                            <a href="admin-manage-products.html">📋 প্রোডাক্ট লিস্ট</a>
                            <hr />
                            <a href="#" id="logoutBtn">লগআউট</a>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <section style="padding-top: 120px; padding-bottom: 60px;">
        <div class="container">
            <div class="section-header">
                <span class="section-tag">অ্যাডমিন</span>
                <h2>📋 সব প্রোডাক্ট</h2>
                <p>এখান থেকে প্রোডাক্ট এডিট বা ডিলিট করুন</p>
            </div>
            <div id="productsList" class="product-grid">
                <!-- প্রোডাক্ট লোড হবে -->
            </div>
        </div>
    </section>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabase, supabaseAdmin } from './js/config.js';
        import { checkAuth, updateAuthUI } from './js/auth.js';
        import { updateCartBadge } from './js/products.js';
        import { isAdmin } from './js/admin.js';

        // Initialize
        const user = await checkAuth();
        updateAuthUI(user);
        updateCartBadge();

        // Admin Check
        const admin = await isAdmin();
        if (!admin) {
            document.querySelector('.section-header h2').innerHTML = '⛔ অ্যাক্সেস অস্বীকৃত';
            document.querySelector('.section-header').innerHTML += '<p style="color: #EF4444;">শুধুমাত্র অ্যাডমিন ইউজার এই পেজ দেখতে পারেন।</p>';
        }

        // Load Products
        async function loadProducts() {
            const { data, error } = await supabase
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error loading products:', error);
                return;
            }

            const container = document.getElementById('productsList');
            container.innerHTML = data.map(product => `
                <div class="product-card" style="position: relative;">
                    <img src="${product.image_url}" alt="${product.name}" class="product-image" />
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <p class="product-category">${product.category}</p>
                        <p class="product-price">৳${product.price}</p>
                        <p style="color: var(--text-secondary); font-size: 14px;">স্টক: ${product.stock}</p>
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <button class="btn-primary" onclick="editProduct('${product.id}')" style="flex: 1; padding: 8px;">
                                <i class="fas fa-edit"></i> এডিট
                            </button>
                            <button class="btn-outline-light" onclick="deleteProduct('${product.id}')" style="flex: 1; padding: 8px; border-color: #EF4444; color: #EF4444;">
                                <i class="fas fa-trash"></i> ডিলিট
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Delete Product
        window.deleteProduct = async (id) => {
            if (!confirm('আপনি কি এই প্রোডাক্ট ডিলিট করতে চান?')) return;

            try {
                const { error } = await supabaseAdmin
                    .from('products')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                showToast('✅ প্রোডাক্ট ডিলিট হয়েছে!', 'success');
                loadProducts();
            } catch (error) {
                showToast('❌ ' + error.message, 'error');
            }
        };

        // Edit Product
        window.editProduct = (id) => {
            window.location.href = `admin-edit-product.html?id=${id}`;
        };

        // Toast
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        loadProducts();
    </script>
</body>
</html>
